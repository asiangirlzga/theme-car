plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lite.racer'
    compileSdk 34

    defaultConfig {
        applicationId "com.lite.racer"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        // Debug-signed (installs directly) but shrunk with R8 to keep APK tiny
        debug {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // No dependencies on purpose: smallest possible APK
}
